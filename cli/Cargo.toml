# ==============================================================================
# cli/Cargo.toml - spoke-triage-cli crate manifest
# ==============================================================================
# Description: Package manifest for the spoke-triage-cli workspace member.
#              publish = false: shipped as a container image, never to
#              crates.io; also lets cargo-deny accept the workspace path
#              dependency (ADR-022).
# Author: Matt Barham
# Created: 2026-09-10
# Modified: 2026-09-26
# Version: 0.1.0
# ==============================================================================

[package]
name = "spoke-triage-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "triage-cli"
path = "src/main.rs"

[dependencies]
spoke-triage-common = { path = "../common" }
tokio.workspace = true
sqlx.workspace = true
anyhow.workspace = true
