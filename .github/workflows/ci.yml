# ==============================================================================
# ci.yml - test-only CI for spoke-triage
# ==============================================================================
# Description: Runs cargo test/clippy on every push and PR. Deploys nothing
#              and needs no Docker socket access — see ADR-019 for why this
#              is a different case from the "no CI" decision it sits next to.
# Author: Matt Barham
# Created: 2026-09-10
# Modified: 2026-09-26
# Version: 0.2.0
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch (action has no release tags)
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings
