# ==============================================================================
# ci.yml - test-only CI for spoke-triage
# ==============================================================================
# Description: Runs cargo test/clippy on every push and PR. Deploys nothing
#              and needs no Docker socket access — see ADR-019 for why this
#              is a different case from the "no CI" decision it sits next to.
# Author: Matt Barham
# Created: 2026-09-10
# Version: 0.1.0
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings
