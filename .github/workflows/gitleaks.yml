# ==============================================================================
# gitleaks.yml - secret scan for spoke-triage
# ==============================================================================
# Description: Scans full git history for committed secrets on every push and
#              PR. Runs the official gitleaks image pinned by digest; deploys
#              nothing and needs no host access (ADR-019, ADR-022).
# Author: Matt Barham
# Created: 2026-09-26
# Modified: 2026-09-26
# Version: 0.1.0
# ==============================================================================
# Documentation:
#   - https://github.com/gitleaks/gitleaks#docker
#   - https://github.com/gitleaks/gitleaks#gitleaksignore
# ==============================================================================

name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose --exit-code 1 \
            --gitleaks-ignore-path /repo/.gitleaksignore
